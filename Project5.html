<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Paste inside <head> -->

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body {
            background-color: forestgreen;
            font-family: Arial, Helvetica, sans-serif;
            padding: 30px 15px;
        }

        h1 {
            text-align: center;
            color: limegreen;
        }

        .club-card {
            text-align: center;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: darkgreen;
        }

        .club-card h3 {
            color: chartreuse;
        }
    </style>
</head>

<body>
    <h1>My School Clubs</h1>
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="club-card">
                    <h3>Coding-Club</h3>
                    <p>I learn how to create websites, games, and simple apps.</p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="club-card">
                    <h3>Drama Club</h3>
                    <p>I love acting and performing in school plays!</p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="club-card">
                    <h3>Art Club</h3>
                    <p>I love painting and creating art with my friends.</p>
                </div>
            </div>
        </div>
        <!-- Paste just before </body> -->
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
        </script>
</body>

</html>
