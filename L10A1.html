<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            background: #fff8f0;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #e65c00;
        }

        h1+p {
            background: #ffe0b2;
            padding: 10px 20px;
            border-radius: 8px;
            color: #bf360c;
            display: inline-block;
        }

        ul {
            padding: 0;
            margin-top: 20px;
        }

        ul>li {
            list-style: none;
            font-size: 18px;
            font-weight: bold;
            color: #5d4037;
            padding: 10px 20px;
            margin: 6px auto;
            width: 260px;
            background: #fff3e0;
            border-radius: 8px;
        }

        ul li:nth-child(3) {
            background: #ffe082;
            color: #e65c00;
        }

        .desc {
            color: #555;
            margin-top: 20px;
            font-size: 15px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .desc::first-letter {
            font-size: 220px;
            color: #e65c00;
            font-weight: bold;
        }

        .links {
            margin-top: 25px;
        }

        a {
            color: #e65c00;
            text-decoration: none;
            font-size: 15px;
            margin: 0 12px;
            padding: 8px 18px;
            border: 1px solid #e65c00;
            border-radius: 8px;
        }

        a:hover {
            background: #e65c00;
            color: #fff;
        }
    </style>
</head>

<body>
    <h1>My food menu</h1>
    <p>Pick your favorite dish and dig in!</p>
    <ul>
        <li>pizza</li>
        <li>pasta-chef's special</li>
        <li>salad</li>
        <li>Ice cream</li>
    </ul>
    <p class="desc">Every dish on this menu is made with love and loads of flavor. Try them all and find your favorite!
    </p>
    <div class="links">
        <a href="#">Order now</a>
        <a href="#">See more</a>
    </div>
</body>

</html>
