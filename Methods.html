<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Arrays Methods in JavaScript</h1>
    <p id="Join_Method"></p>
    <p id="Pop_Method"></p>
    <script>
        var arr = ["Toyota", "Suzuki", "Hyundai", "Mercedes", "BMW", "Audi"];
        //document.write(arr[3] + "<br>");
        c = arr.join("/");
        document.getElementById("Join_Method").innerHTML = c;
        arr.pop();
        document.getElementById("Pop_Method").innerHTML = arr;
    </script>
</body>

</html>
