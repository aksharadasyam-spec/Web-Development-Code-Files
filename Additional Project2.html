<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>My Food Menu</h1>
    <p>This is my favorite food menu!</p>
    <ul>
        <li>Pizza</li>
        <li>Burger</li>
        <li>French Fries</li>
        <li>Ice Cream</li>
    </ul>
    <p>Create a ordering form </p>
    <form>
        <fieldset>
            <legend>Personal Details</legend>
            <label>Your name:</label> <input type="text" id="uname"><br><br>
            <label>Phone number:</label> <input type="number" id="pnum"><br><br>
            <label>Email:</label> <input type="email" id="email"><br><br>
        </fieldset>
        <fieldset>
            <legend>Your Order Details</legend>
            <label>Choose your food:</label>
            <select id="food">
                <option value="">--Select a food--</option>
                <option value="pizza">Pizza</option>
                <option value="burger">Burger</option>
                <option value="fries">French Fries</option>
                <option value="icecream">Ice Cream</option>
            </select><br><br>
            <label>Any notes for the chef:</label> <textarea id="notes" rows="3" cols="30"></textarea><br><br>
        </fieldset>
        <fieldset>
            <legend>Preferred Delivery Time</legend>
            <input type="checkbox" value="morning">Morning<br>
            <input type="checkbox" value="afternoon">Afternoon<br>
            <input type="checkbox" value="evening">Evening<br>
        </fieldset>
        <br>
        <input type="submit" value="Place my Order">
</body>

</html>
