<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: darkgreen;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .fact-file {
            background-color: lightyellow;
            color: darkslategrey;
            width: 400px;
            padding: 25px;
            border: 4px solid forestgreen;
            margin: 30px;
        }

        .animal-image {
            color: forestgreen;
            font-size: 22px;
            margin-right: 30px;
        }

        .detail {
            color: darkslategray;
        }

        .cool-fact {
            color: darkorange;
            font-style: italic;
        }
    </style>
</head>

<body>
    <center>
        <div class="fact-file">
            <img src="Snow leopard.jpg" alt="Snow leopard" class="animal-image" width="300" height="200">
            <h2 class="animal-name">Snow leopard</h2>
            <p class="detail">Type: Big cat</p>
            <p class="detail">Lives in: Mountain ranges of Central Asia</p>
            <p class="cool-fact">Cool fact: Can leap up to 15 metres in one jump</p>
        </div>
    </center>
</body>

</html>
