<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Paste inside <head> -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body {
            background-color: aqua;
            font-family: Arial, Helvetica, sans-serif;
            padding: 30px 15px;
        }

        h1 {
            text-align: center;
            color: aquamarine;
        }

        .hobby-card {
            text-align: center;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: blue;
        }

        .hobby-card h3 {
            color: turquoise;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Drawing</h3>
                    <p>I love sketching animals and comic characters!</p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Football</h3>
                    <p>I love playing football with my friends!</p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Skating</h3>
                    <p>I love skating in the park with my family.</p>
                </div>
            </div>
        </div>
    </div>
    <!-- Paste just before </body> -->

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">

    </script>
</body>

</html>
