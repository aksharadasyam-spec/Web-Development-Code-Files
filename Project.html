<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Book Donation Form</h1>
    <p>Please fill in the form below to donate a book:</p>
    <hr>
    <form>
        <fieldset>
            <legend>Personal Details</legend>
            <label>Your name:</label> <input type="text" id="uname"><br><br>
            <label>Email:</label> <input type="email" id="email"><br><br>
            <label>Phone number:</label> <input type="tel" id="phone"><br><br>
        </fieldset>
        <fieldset>
            <legend>Book Details</legend>
            <label>Book title:</label> <input type="text" id="title"><br><br>
            <label>Author:</label> <input type="text" id="author"><br><br>
            <label>Genre:</label>
            <select id="genre">
                <option value="">--Select a genre--</option>
                <option value="fiction">Fiction</option>
                <option value="non-fiction">Non-fiction</option>
                <option value="mystery">Mystery</option>
                <option value="fantasy">Fantasy</option>
                <option value="biography">Biography</option>
                <!-- Add more genres as needed -->
            </select><br><br>
        </fieldset>
        <fieldset>
            <legend>Donation Details</legend>
            <label>Condition of the book:</label><br>
            <input type="radio" name="condition" value="new"> New<br>
            <input type="radio" name="condition" value="good"> Good<br>
            <input type="radio" name="condition" value="fair"> Fair<br><br>

            <label>Additional notes (optional):</label><br>
            <textarea id="notes" rows="3" cols="30"></textarea><br><br>

        </fieldset>

        <input type="submit" value="Submit Donation">
    </form>
</body>

</html>
